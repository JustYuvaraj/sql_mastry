<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL Mastery | Practice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Marked.js for Editorial Markdown Rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
    <!-- Top Navigation Bar -->
    <nav class="top-nav">
        <div class="nav-left">
            <div class="nav-logo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="#ffa116" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </div>
            <div class="section-toggle">
                <button class="section-btn active" id="section-leetcode" data-section="leetcode">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M16 18l6-6-6-6" />
                        <path d="M8 6l-6 6 6 6" />
                    </svg>
                    LeetCode
                </button>
                <button class="section-btn" id="section-unstop" data-section="unstop">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10" />
                        <path d="M8 12l2 2 4-4" />
                    </svg>
                    Unstop
                </button>
            </div>
            <button class="nav-btn" id="problem-list-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="6" x2="21" y2="6" />
                    <line x1="3" y1="12" x2="21" y2="12" />
                    <line x1="3" y1="18" x2="21" y2="18" />
                </svg>
                <span>Problem List</span>
            </button>
            <div class="nav-arrows">
                <button class="nav-icon-btn" id="prev-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5">
                        <polyline points="15 18 9 12 15 6" />
                    </svg></button>
                <button class="nav-icon-btn" id="next-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5">
                        <polyline points="9 18 15 12 9 6" />
                    </svg></button>
            </div>
        </div>
        <div class="nav-center">
            <button class="run-btn" id="run-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <polygon points="5 3 19 12 5 21 5 3" />
                </svg>
                <span>Run</span>
            </button>
            <button class="submit-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="20 6 9 17 4 12" />
                </svg>
                <span>Submit</span>
            </button>
        </div>
        <div class="nav-right">
            <span class="nav-text-muted" id="problem-counter">0 / 100</span>
            <button class="nav-btn" id="camera-toggle-btn" title="Toggle Webcam Overlay">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M23 7l-7 5 7 5V7z" />
                    <rect x="1" y="5" width="15" height="14" rx="2" ry="2" />
                </svg>
                <span>Camera</span>
            </button>
        </div>
    </nav>

    <!-- Floating Webcam Overlay -->
    <div id="webcam-overlay" class="webcam-overlay hidden">
        <div class="webcam-header" id="webcam-drag-handle">
            <span class="webcam-label">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                    <circle cx="12" cy="12" r="5" />
                    <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2" />
                </svg>
                LIVE
            </span>
            <div class="webcam-controls">
                <button class="webcam-ctrl-btn" id="webcam-pip-btn" title="Picture in Picture">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="3" width="20" height="14" rx="2" />
                        <rect x="14" y="11" width="8" height="6" rx="1" />
                    </svg>
                </button>
                <button class="webcam-ctrl-btn" id="webcam-close-btn" title="Close">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </button>
            </div>
        </div>
        <video id="webcam-video" autoplay playsinline muted></video>
        <div class="webcam-footer">
            <button class="webcam-size-btn active" data-size="sm">S</button>
            <button class="webcam-size-btn" data-size="md">M</button>
            <button class="webcam-size-btn" data-size="lg">L</button>
        </div>
    </div>

    <!-- Main Split Pane -->
    <div class="workspace">
        <!-- Left Panel: Problem Description -->
        <div class="left-panel" id="left-panel">
            <!-- Tabs -->
            <div class="panel-tabs">
                <button class="tab active" id="tab-description">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                        <polyline points="14 2 14 8 20 8" />
                    </svg>
                    <span>Description</span>
                </button>

                <button class="tab" id="tab-editorial">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
                    </svg>
                    <span>Editorial</span>
                </button>
            </div>
            <!-- Description Content -->
            <div class="panel-content" id="description-view">
                <div class="empty-state">
                    <p>Select a problem from the <strong>Problems</strong> tab to begin.</p>
                </div>
            </div>
            <!-- Problem List Content -->
            <div class="panel-content" id="problems-view" style="display:none;">
                <div id="sidebar-content"></div>
            </div>
            <!-- Editorial Content -->
            <div class="panel-content" id="editorial-view" style="display:none;">
                <div class="empty-state">
                    <p>Select a problem to view its <strong>Editorial</strong>.</p>
                </div>
            </div>
            <!-- Bottom Stats Bar -->
            <div class="panel-bottom-bar">
                <span id="likes-count">👍 —</span>
                <span id="difficulty-label"></span>
            </div>
        </div>

        <!-- Gutter -->
        <div class="gutter" id="gutter"></div>

        <!-- Right Panel: Code Editor -->
        <div class="right-panel" id="right-panel">
            <!-- Code Header -->
            <div class="code-header">
                <div class="code-header-left">
                    <div class="lang-select">
                        <span>MySQL</span>
                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5">
                            <polyline points="6 9 12 15 18 9" />
                        </svg>
                    </div>
                </div>
                <div class="code-header-right">
                    <button class="icon-btn-sm" title="Bookmark"><svg width="16" height="16" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />
                        </svg></button>
                    <button class="icon-btn-sm" title="Settings"><svg width="16" height="16" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="3" />
                            <path
                                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33 1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82 1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
                        </svg></button>
                    <button class="icon-btn-sm" title="Expand"><svg width="16" height="16" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="15 3 21 3 21 9" />
                            <polyline points="9 21 3 21 3 15" />
                            <line x1="21" y1="3" x2="14" y2="10" />
                            <line x1="3" y1="21" x2="10" y2="14" />
                        </svg></button>
                </div>
            </div>
            <!-- Editor -->
            <div class="code-editor-area">
                <div class="line-numbers" id="line-numbers">1</div>
                <textarea id="sql-editor" spellcheck="false"
                    placeholder="-- Write your MySQL query statement below"></textarea>
            </div>
            <!-- Bottom: Testcase / Results -->
            <div class="results-section">
                <div class="results-tabs">
                    <button class="results-tab active" id="tab-testcase">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#00af9b" stroke-width="2.5">
                            <polyline points="20 6 9 17 4 12" />
                        </svg>
                        Testcase
                    </button>
                    <button class="results-tab" id="tab-result">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <polyline points="4 17 10 11 4 5" />
                            <line x1="12" y1="19" x2="20" y2="19" />
                        </svg>
                        Test Result
                    </button>
                </div>
                <div class="results-content" id="results-container">
                    <!-- Testcase View -->
                    <div id="testcase-view">
                        <div class="testcase-selector" id="testcase-tabs">
                            <!-- Case tabs will be injected here -->
                        </div>
                        <div id="testcase-details">
                            <div class="empty-state">
                                <p>Select a problem to see test cases</p>
                            </div>
                        </div>
                    </div>
                    <!-- Result View -->
                    <div id="result-view" style="display: none;">
                        <div class="empty-state">
                            <p>Click <strong>Run</strong> to see results</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- SQL Schema Modal -->
    <div class="modal-overlay" id="schema-modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">SQL Schema</span>
                <span class="modal-close" id="close-modal">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </span>
            </div>
            <div class="modal-body">
                <pre id="modal-schema-content"></pre>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <script type="module" src="main.js"></script>
</body>

</html>
